name: ICEbreaker quality gates
on:
  pull_request:
  push:
    branches: [main, "codex/**"]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run audit
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: Test built browser workflows
        run: |
          npm run preview > /tmp/icebreaker-preview.log 2>&1 &
          for attempt in {1..30}; do curl -fsS http://localhost:4178/ > /dev/null && break || sleep 1; done
          ICEBREAKER_TEST_URL=http://localhost:4178 npm run test:ui
      - run: npm run build:github-pages
      - run: npm run release:check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prototype-pages-${{ github.sha }}
          path: work/github-pages
          retention-days: 14
          include-hidden-files: true
      # Intentionally no deploy step or cloud credentials. Production promotion is gated.
